<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Cyber Chase - Contato</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/logo/png/Favicon.png">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/contact.css">
    <link rel="stylesheet" href="css/footer.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Roboto+Mono:wght@100&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&family=Racing+Sans+One&family=Roboto+Mono:wght@100&display=swap" rel="stylesheet">
</head>

<body>

    <nav class="navbar">
        <a href="index.html"> <img src="assets/logo/svg/Logo.svg" id="Logo"></a>
        <div class="mobile-menu">
            <div class="line1"></div>
            <div class="line1"></div>
            <div class="line1"></div>
        </div>
        <ul class="nav-links">
            <li class="nav-links"><a href="/about">Sobre Nós</a></li>
            <li class="nav-links"><a href="/courses">Cursos</a></li>
            <li class="nav-links"><a href="/contact">Contato</a></li>
        </ul>
    </nav>

    <div class="content-wrapper">

        <main class="main">

            <h1 class="contact-title">Fale conosco!</h1>
            <div class="container">
                <form class="contact-form" action="https://formsubmit.co/cyber0chase@gmail.com" method="POST" data-form>
                    <label for="nome">Digite seu nome: </label>
                    <input type="nome" id="name" name="name" class="form-input" required>
                    <label for="email">Digite seu endereço de e-mail: </label>
                    <input type="email" id="email" name="email" class="form-input" required>
                    <label for="message">Digite sua mensagem: </label>
                    <textarea id="message" name="message" rows="4" class="form-textarea" required></textarea>
                    <button type="submit" class="form-button" data-button>Enviar mensagem</button>

                </form>
            </div>

        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&#169; 2026 Cyber Chase. Todos os Direitos Reservados.</p>
                <div class="github-logo">
                    <a href="https://github.com/orgs/Cyber-Chase/repositories" target="_blank">
                        <img src="assets/icon/svg/github_white.svg" alt="GitHub">
                    </a>
                </div>
            </div>
        </footer>

    </div>

</body>

</html>
